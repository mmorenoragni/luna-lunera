# CI: análisis estático, build Docker, deploy a GitHub Pages
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ---- 1. Análisis estático y reporte de vulnerabilidades ----
  analyze:
    name: Análisis estático y seguridad
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: CodeQL – Inicializar
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: CodeQL – Analizar
        uses: github/codeql-action/analyze@v3
        with:
          category: "/javascript"

      - name: npm audit – Vulnerabilidades en dependencias
        run: |
          echo "## Reporte de vulnerabilidades (npm audit)" >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=moderate || true
          npm audit --json > audit-results.json 2>/dev/null || echo '{"metadata":{},"vulnerabilities":{}}' > audit-results.json
        continue-on-error: true

      - name: Resumen de npm audit
        run: |
          if [ -f audit-results.json ]; then
            CRITICAL=$(jq -r '.metadata.vulnerabilities.critical // 0' audit-results.json)
            HIGH=$(jq -r '.metadata.vulnerabilities.high // 0' audit-results.json)
            MODERATE=$(jq -r '.metadata.vulnerabilities.moderate // 0' audit-results.json)
            LOW=$(jq -r '.metadata.vulnerabilities.low // 0' audit-results.json)
            echo "| Nivel     | Cantidad |" >> $GITHUB_STEP_SUMMARY
            echo "|-----------|----------|" >> $GITHUB_STEP_SUMMARY
            echo "| Critical  | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| High      | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| Moderate  | $MODERATE |" >> $GITHUB_STEP_SUMMARY
            echo "| Low       | $LOW |" >> $GITHUB_STEP_SUMMARY
          fi

  # ---- 2. Build de la aplicación e imagen Docker ----
  build-docker:
    name: Build e imagen Docker
    runs-on: ubuntu-latest
    needs: analyze
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build y push de la imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ---- 3. Despliegue estático a GitHub Pages (no ejecuta Docker; publica dist/) ----
  deploy-pages:
    name: Deploy a GitHub Pages
    runs-on: ubuntu-latest
    needs: build-docker
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Build para GitHub Pages
        run: npx vite build --base /${{ github.event.repository.name }}/

      - name: Subir artifact para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Desplegar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # ---- 4. Despliegue de imagen Docker a EC2 (solo push a main) ----
  deploy-ec2:
    name: Deploy a EC2
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-docker
    permissions:
      contents: read
    env:
      AWS_REGION: us-east-2
      IMAGE: ghcr.io/${{ github.repository }}:latest
    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Arrancar instancia EC2 si está parada
        run: |
          aws ec2 start-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID }} --region ${{ env.AWS_REGION }} || true
          aws ec2 wait instance-running --instance-ids ${{ secrets.EC2_INSTANCE_ID }} --region ${{ env.AWS_REGION }}

      - name: Esperar a que la instancia esté disponible en SSM
        run: |
          for i in $(seq 1 30); do
            if aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text \
              --region ${{ env.AWS_REGION }} 2>/dev/null | grep -q Online; then
              echo "Instancia lista en SSM"
              break
            fi
            echo "Esperando SSM... ($i/30)"
            sleep 10
          done

      - name: Desplegar imagen Docker vía SSM
        id: ssm-deploy
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          PARAMS=$(printf '{"commands":["set -e","docker pull %s","docker stop luna-lunera 2>/dev/null || true","docker rm luna-lunera 2>/dev/null || true","for c in $(docker ps -q); do docker port $c 2>/dev/null | grep -qE '\''(0.0.0.0|:::):80'\'' && docker stop $c && docker rm -f $c; done || true","docker run -d --name luna-lunera --restart unless-stopped -p 8080:80 %s"]}' "$IMAGE" "$IMAGE")
          set +e
          COMMAND_OUTPUT=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --timeout-seconds 300 \
            --region ${{ env.AWS_REGION }} \
            --output json 2>&1)
          SEND_EXIT=$?
          if [ $SEND_EXIT -ne 0 ]; then
            echo "::error::aws ssm send-command falló (exit $SEND_EXIT). Revisa permisos IAM (ssm:SendCommand) y que la instancia esté Online en SSM."
            echo "$COMMAND_OUTPUT"
            exit $SEND_EXIT
          fi
          COMMAND_ID=$(echo "$COMMAND_OUTPUT" | jq -r '.Command.CommandId')
          if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" = "null" ]; then
            echo "::error::No se obtuvo CommandId de SSM."
            echo "$COMMAND_OUTPUT"
            exit 1
          fi
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Comprobar resultado del comando SSM
        run: |
          COMMAND_ID="${{ steps.ssm-deploy.outputs.command_id }}"
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ${{ env.AWS_REGION }} \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")
            if [ "$STATUS" = "Success" ]; then
              echo "Despliegue completado correctamente"
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "::error::Despliegue falló con estado: $STATUS"
              echo "=== Salida estándar (stdout) en la instancia ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ${{ env.AWS_REGION }} \
                --query 'StandardOutputContent' --output text
              echo "=== Errores (stderr) en la instancia ==="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ${{ env.AWS_REGION }} \
                --query '[Status, StatusDetails, StandardErrorContent]' --output text
              exit 1
            fi
            echo "Esperando comando SSM... $STATUS ($i/60)"
            sleep 5
          done
          echo "Timeout esperando resultado del comando SSM"
          exit 1
